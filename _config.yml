# Import the theme
theme: jekyll-theme-chirpy

# 한국어 사용
lang: ko-KR

# 타임존
timezone: Asia/Seoul

# ↓ --------------------------
title: 달빛이 비추는 궁전에서

tagline: IT Infra Engineer | GCP, 시스템, 네트워크

description: >-
  IT 인프라 엔지니어의 기술 블로그. GCP, 시스템, 네트워크 관련 글을 정리합니다.

url: "https://seonggi.github.io"

github:
  username: SeongGi

social:
  name: Seong Gi
  email: ""
  links:
    - https://github.com/SeongGi
    - https://www.linkedin.com/in/seonggi/

# Web Analytics Settings
analytics:
  google:
    id:

theme_mode: # [light | dark]

cdn:

avatar:

toc: true

plugins:
  - jekyll-archives
  - jekyll-seo-tag
  - jekyll-sitemap

comments:
  provider:

assets:
  self_host:
    enabled:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
